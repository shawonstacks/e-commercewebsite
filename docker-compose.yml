version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: e-commerce-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: e-commerce-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/e-commercedb
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: e-commerce-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: